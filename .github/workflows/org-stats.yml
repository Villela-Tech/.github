name: Estatísticas da organização
on:
  schedule:
    - cron: "30 9 * * *"   # todo dia às 06:30 de Brasília
  workflow_dispatch:       # permite rodar na mão
jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Gera os cards
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_STATS_TOKEN }}
        run: python3 .github/scripts/org_stats.py profile

      - name: Salva os cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/org-stats.svg profile/org-languages.svg
          git diff --cached --quiet || (git commit -m "Atualiza estatísticas da organização" && git pull --rebase && git push)
